name: "HA Monitor - 辣堡健康位置监控"
version: "2.1.1"
slug: "ha_monitor"
description: "监控辣堡手表（Wear OS）健康与位置数据，异常时通过 webhook 直推米糊（Hermes Agent）"
url: "https://github.com/LeoZhou0423/ha-monitor-addon"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
# base 镜像使用该系统可达的镜像源（ghcr.nju.edu.cn = 南京大学 ghcr 代理）
build_from:
  aarch64: "ghcr.nju.edu.cn/home-assistant/aarch64-base:3.23"
  amd64: "ghcr.nju.edu.cn/home-assistant/amd64-base:3.23"
  armhf: "ghcr.nju.edu.cn/home-assistant/armhf-base:3.23"
  armv7: "ghcr.nju.edu.cn/home-assistant/armv7-base:3.23"
  i386: "ghcr.nju.edu.cn/home-assistant/i386-base:3.23"
init: false
startup: application
# 允许 SUPERVISOR_TOKEN 访问 supervisor API（bashio::config 读取 options 必需）
auth_api: true
# 允许经 supervisor 网关访问 HA core（http://supervisor/core，WebSocket 认证必需）
homeassistant_api: true
boot: auto
map:
  - config:rw
options:
  webhook_url: "http://192.168.0.41:8644/webhooks/ha_alerts"
  webhook_secret: "AKxRixstk7D15McUTtte5e41rcYlK9olgxEHYxiHT34"
  watchdog_enabled: true
  stale_min: 40
  cooldown: 600
  temp_low: 33.0
  temp_high: 37.8
  hr_high: 110
  hr_low: 55
  ha_direct_url: "ws://homeassistant:8123/api/websocket"
  ha_direct_token: ""
schema:
  webhook_url: str
  webhook_secret: str
  watchdog_enabled: bool
  stale_min: int
  cooldown: int
  temp_low: float
  temp_high: float
  hr_high: int
  hr_low: int
  ha_direct_url: str
  ha_direct_token: str
